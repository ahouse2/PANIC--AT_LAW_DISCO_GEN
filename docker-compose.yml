services:
  legal_discovery:
    build:
      context: ./neuro-san-studio-2
      dockerfile: apps/legal_discovery/Dockerfile
    ports:
      - "8080:5001"
    env_file:
      - panic_at_law_disco_gen/config/settings.sample.env
    environment:
      - AGENT_MANIFEST_FILE=/usr/src/app/registries/manifest.hocon
      - AGENT_LLM_INFO_FILE=/usr/src/app/registries/llm_config.hocon
      - AGENT_TOOL_PATH=/usr/src/app/coded_tools
      - PYTHONPATH=/usr/src/app:/usr/src/panic
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://postgres@postgres:5432/legal_discovery}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis
    volumes:
      - ./neuro-san-studio-2:/usr/src/app
      - ./panic_at_law_disco_gen:/usr/src/panic:ro
      - ./panic_at_law_disco_gen/config/llm_config.gemini.hocon:/usr/src/app/registries/llm_config.hocon:ro
      - ./Test_Folder:/usr/src/app/uploads/Test_Folder:ro
      - ./UI_refs:/usr/src/app/apps/legal_discovery/static/ui_refs:ro
    command: >-
      bash -c "python -m gunicorn -k eventlet -w 1 -b 0.0.0.0:5001 apps.legal_discovery.startup:app"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=legal_discovery
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5.23
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7474:7474"
      - "7687:7687"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
